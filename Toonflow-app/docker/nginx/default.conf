# 带内容哈希的静态资源（如 ts.worker-DGHjMaqB.js、未来的 assets/index-xxx.js）一年强缓存；
# index.html 每次协商（304）保证发版即生效；其余（/api、/oss 等后端路径）不加缓存头
map $uri $static_cache_control {
    "~*-[A-Za-z0-9_-]{6,12}\.(js|mjs|css|woff2?|png|jpe?g|gif|svg|webp|ico)$"  "public, max-age=31536000, immutable";
    "~*^/index\.html$"  "no-cache";
    /                   "no-cache";
    default             "";
}

server {
    listen 80;

    # 前端静态文件：由 nginx 直接从挂载的 Toonflow-web 构建产物 (dist/) 提供
    root /usr/share/nginx/html;
    index index.html;

    # Increase max body size to match the app's 100 MB limit
    client_max_body_size 100m;

    # 静态预压缩优先（构建期由 restart.sh 的 compress_dist 步骤生成 .br/.gz），
    # 没有预压缩产物的响应再动态压缩兜底
    brotli_static on;
    gzip_static on;
    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml;

    # 动态 gzip 兜底：压缩大 JS/HTML 响应
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_min_length 1024;
    gzip_types
        text/html
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        font/woff2;

    # Socket.IO — must upgrade to WebSocket
    location /socket.io/ {
        proxy_pass         http://toonflow:10588;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # 先按静态文件匹配（首页 index.html、favicon、monaco worker js 等），
    # 命中不了（/api、/oss、/skills、/assets 等接口路径）再落到 @backend 转发给 Node
    location / {
        add_header Cache-Control $static_cache_control;
        try_files $uri $uri/ @backend;
    }

    # 对象存储：统一转发给 Node 应用处理（应用内部再去读 MinIO），
    # 不让浏览器直连 MinIO —— 这样缩略图（?size=）才能在后端生成
    location @backend {
        proxy_pass         http://toonflow:10588;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # Compress response from upstream before sending to browser
        proxy_set_header   Accept-Encoding "";
    }
}
