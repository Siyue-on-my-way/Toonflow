name: toonflow-v2

# 只含应用本体一个服务（Node 直接托管前端构建产物，无需独立 nginx）。
# MySQL / MinIO 使用中间件中心共享实例（infra-mysql:1886 / infra-minio:1883），
# 凭证见 .env；接入配置由 middleware-center/scripts/new-project.sh 生成，
# 摘要见 /mnt/middleware-center/projects/toonflow/CONNECT.md。
services:
  toonflow:
    build:
      # 上下文 = 仓库根（Dockerfile 在根目录，COPY 的是 Toonflow-app / Toonflow-web）
      context: ..
      dockerfile: Dockerfile
    image: toonflow:latest
    container_name: toonflow
    env_file:
      - .env
    environment:
      NODE_ENV: prod
      PORT: "${APP_PORT:-10588}"
      # Node 直接托管前端构建产物，无需独立 nginx
      WEB_DIST: /app/public
    ports:
      - "${HOST_PORT:-2280}:${APP_PORT:-10588}"
    volumes:
      # 运行时数据（首次启动由镜像内 entrypoint 从 data.bundle 初始化）
      - ./volumes/data:/app/data
    extra_hosts:
      # docker-host 模式：通过宿主机映射端口访问中间件中心
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10588/').then(() => process.exit(0)).catch(() => process.exit(1));"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
